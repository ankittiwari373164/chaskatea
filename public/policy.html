CT.ready(()=>{
const st=CT.cfg.settings.store, cod=CT.cfg.settings.payments.cod, MAIL='info@chaskatea.com';
const WA=`<a href="https://wa.me/${st.whatsapp}" target="_blank" rel="noopener">WhatsApp</a>`;
const contact=`<p>Email: <a href="mailto:${MAIL}">${MAIL}</a><br>Phone: <a href="tel:${st.phone.replace(/\s/g,'')}">${st.phone}</a><br>WhatsApp: ${WA}<br>Address: ChaskaTea, ${st.address}</p>`;
const upd='<p class="pol-upd">Last updated: 24 November 2026</p>';
const P={
'/shipping-returns':['Shipping & Returns Policy','Free shipping across India, cash on delivery, order tracking, cancellations, returns and refunds at ChaskaTea.',`${upd}
<h2>1. Shipping charges</h2><p>Shipping is <b>free on all orders</b> delivered within India. There are no hidden delivery charges at checkout.</p>
<h2>2. Where we deliver</h2><p>We deliver to serviceable pin codes across India through our courier partners, using Shipmozo. If your pin code is not serviceable, we will contact you before cancelling the order and refund any payment in full.</p>
<h2>3. Dispatch and delivery time</h2><p>Orders are usually dispatched within 1–3 working days after they are confirmed. Delivery time depends on your location and the courier, and is typically 3–8 working days after dispatch. Delays can happen during holidays, bad weather or other events outside our control.</p>
<h2>4. Order tracking</h2><p>When your order ships, we send you an email with the courier name and tracking link. You can also check your order any time on our <a href="/track">Track order</a> page using your order number and phone number, or in <a href="/account">My account</a>.</p>
<h2>5. Cash on delivery (COD)</h2><p>Cash on delivery is available on eligible orders${cod.maxAmount?` up to ₹${cod.maxAmount.toLocaleString('en-IN')}`:''}${cod.fee?` with a ₹${cod.fee} COD fee`:''}. Please keep the exact amount ready. Paying online (UPI, cards, netbanking, wallets via Razorpay) gives you upto ₹30 off per pack.</p>
<h2>6. Failed delivery</h2><p>If the courier cannot deliver after repeated attempts, for example because of a wrong address, an unreachable phone number or a refused COD order, the parcel is returned to us. For prepaid orders we will refund the amount after the parcel reaches us. Repeated refusal of COD orders may lead us to turn off COD for that phone number or address.</p>
<h2>7. Cancelling an order</h2><p>You can cancel your order from <a href="/account">My account</a> before it is packed, or by contacting us. Once an order is packed or shipped it cannot be cancelled. Prepaid orders cancelled before dispatch are refunded in full.</p>
<h2>8. Returns and replacements</h2><p>Tea is a food product, so for hygiene reasons we cannot accept returns of opened packs or returns because of a change of mind. We will happily <b>replace or refund</b> if:</p><ul><li>you received a damaged, leaking or tampered pack,</li><li>you received the wrong product or pack size, or</li><li>an item is missing from your order.</li></ul><p>Please contact us within <b>48 hours of delivery</b> with your order number and clear photos of the parcel and product (and an unboxing video if available). Once we verify the issue, we will send a replacement or issue a refund at no extra cost.</p>
<h2>9. Refunds</h2><p>Approved refunds for online payments go back to the original payment method through Razorpay. After we process a refund, banks usually take 5–7 working days to credit it. For COD orders, we refund by UPI or bank transfer to an account you provide. We will email you when your refund is processed.</p>
<h2>10. Contact us</h2>${contact}`],
'/privacy':['Privacy Policy','How ChaskaTea collects, uses and protects your personal information when you shop on chaskatea.com.',`${upd}
<p>ChaskaTea ("we", "us") respects your privacy. This policy explains what information we collect when you visit www.chaskatea.com or place an order, how we use it, and the choices you have.</p>
<h2>1. Information we collect</h2><ul><li><b>Order and account details:</b> your name, phone number, email address and delivery address, and your password (stored encrypted) if you create an account.</li><li><b>Order history:</b> products you buy, order value, payment method and delivery status.</li><li><b>Messages:</b> anything you send us through the contact form, newsletter signup, email or WhatsApp.</li><li><b>Device and usage data:</b> such as browser type, pages visited and approximate location, collected through cookies and similar technologies.</li></ul>
<h2>2. Payment information</h2><p>Online payments are processed securely by <b>Razorpay</b>. We never see or store your full card, UPI PIN or netbanking details. We only receive a payment confirmation and reference number.</p>
<h2>3. How we use your information</h2><ul><li>To process, ship and deliver your orders and handle returns and refunds.</li><li>To send order emails and updates, for example confirmation, shipping, delivery and cancellation messages.</li><li>To respond to your questions and provide customer support.</li><li>To send offers and news if you subscribe. You can unsubscribe any time.</li><li>To improve our website and products, and to prevent fraud and misuse.</li></ul>
<h2>4. Who we share it with</h2><p>We do not sell your personal information. We share only what is needed with trusted service providers who help us run the store:</p><ul><li><b>Razorpay</b>: payment processing.</li><li><b>Shipmozo and courier partners</b>: your name, phone and address for delivery.</li><li><b>Email and hosting providers</b>: to run the website and send emails.</li><li><b>Analytics and advertising tools</b> such as Google Analytics and Meta (Facebook/Instagram), which use cookies to measure visits and the performance of our ads.</li></ul><p>We may also disclose information if the law requires it.</p>
<h2>5. Cookies</h2><p>We use cookies and local storage to keep you signed in, remember your cart and wishlist, and understand how visitors use the site. You can block or delete cookies in your browser settings, but parts of the site such as the cart and login may then not work properly.</p>
<h2>6. Data security and retention</h2><p>Our website uses HTTPS encryption, passwords are stored in hashed form, and payment keys are encrypted. We keep order records for as long as needed for delivery, support, and accounting and tax law, and delete other data when it is no longer needed.</p>
<h2>7. Your rights</h2><p>You can view and update your details in <a href="/account">My account</a>. You can ask us to correct or delete your personal information, or to stop sending you marketing emails, by writing to <a href="mailto:${MAIL}">${MAIL}</a>. We may need to keep some order records where the law requires it.</p>
<h2>8. Children</h2><p>Our website is meant for adults. We do not knowingly collect information from children under 18.</p>
<h2>9. Changes to this policy</h2><p>We may update this policy from time to time. The latest version will always be on this page, with the date it was last updated.</p>
<h2>10. Grievance officer and contact</h2><p>For any privacy questions or complaints, contact our Grievance Officer:</p>${contact}`],
'/terms':['Terms & Conditions','Terms and conditions for using chaskatea.com and buying ChaskaTea products online.',`${upd}
<p>Welcome to www.chaskatea.com, operated by ChaskaTea. By using this website or placing an order, you agree to these terms. Please read them carefully.</p>
<h2>1. Eligibility and your account</h2><p>You must be 18 or older to place an order, or have a parent or guardian's permission. You are responsible for keeping your account password confidential and for all activity under your account. Please give accurate name, phone, email and address details.</p>
<h2>2. Products</h2><p>We describe our products and show their images as accurately as we can. Packaging design, colour and appearance may vary slightly between batches or on different screens. Tea is a natural product, so taste and colour can vary slightly from one lot to another.</p>
<h2>3. Prices and offers</h2><p>All prices are in Indian Rupees (₹) and include applicable taxes. Shipping is free within India unless shown otherwise at checkout. Discounts, coupons and the prepaid offer (upto ₹30 off per pack when paying online) are subject to their stated conditions, cannot be exchanged for cash, and may be changed or withdrawn at any time. If a product is listed at a wrong price because of an error, we may cancel the order and refund any payment.</p>
<h2>4. Orders</h2><p>Your order is an offer to buy. A contract is formed when we confirm your order by email or on the order confirmation page. We may refuse or cancel an order if a product is out of stock, the delivery address is not serviceable, the payment fails, or we suspect fraud or misuse. If we cancel a prepaid order, we refund the full amount.</p>
<h2>5. Payment</h2><p>We accept online payments through Razorpay (UPI, cards, netbanking and wallets) and cash on delivery on eligible orders. Online orders are confirmed only after the payment succeeds. Unpaid online orders may be cancelled automatically.</p>
<h2>6. Shipping, returns and refunds</h2><p>Delivery, cancellation, returns and refunds follow our <a href="/shipping-returns">Shipping &amp; Returns Policy</a>, which is part of these terms.</p>
<h2>7. Use of the website</h2><p>Do not misuse this website, for example by attempting unauthorised access, placing fake orders, copying content for commercial use, or posting unlawful content. We may suspend accounts that break these terms.</p>
<h2>8. Intellectual property</h2><p>The ChaskaTea name, logo, "Taste of Happiness", product designs, photos and website content belong to ChaskaTea and may not be used without our written permission.</p>
<h2>9. Limitation of liability</h2><p>To the extent permitted by law, our total liability for any order is limited to the amount you paid for that order. We are not responsible for delays or failures caused by events beyond our reasonable control, such as courier delays, natural events or network outages.</p>
<h2>10. Privacy</h2><p>Your use of the website is also covered by our <a href="/privacy">Privacy Policy</a>.</p>
<h2>11. Governing law</h2><p>These terms are governed by the laws of India. Any disputes will be subject to the exclusive jurisdiction of the courts in Assam, India.</p>
<h2>12. Changes</h2><p>We may update these terms from time to time. The version on this page at the time of your order applies to that order.</p>
<h2>13. Contact us</h2>${contact}`]};
const path=location.pathname.replace(/\/$/,''), p=P[path]||P['/privacy'];
CT.$('#t').textContent=p[0];CT.$('#b').innerHTML=p[2];document.title=p[0]+' | ChaskaTea';
const set=(q,a,v)=>{const m=document.head.querySelector(q);if(m)m.setAttribute(a,v)};
const url='https://www.chaskatea.com'+(P[path]?path:'/privacy');
set('meta[name=description]','content',p[1]);set('link[rel=canonical]','href',url);set('meta[property="og:url"]','content',url);set('meta[property="og:title"]','content',p[0]+' | ChaskaTea');set('meta[property="og:description"]','content',p[1]);
});
</script>
