<meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="Sign in | ChaskaTea"><meta name="twitter:description" content="Sign in to your ChaskaTea account."><meta name="twitter:image" content="https://www.chaskatea.com/img/og-chaskatea.jpg">

</head><body class="">
<div id="chrome-top"></div>
<main id="main">

<div class="wrap"><div class="authbox"><span class="eyebrow">Welcome back</span><h1 style="margin-top:.6rem">Log in</h1><p style="color:var(--muted)">Track orders, save addresses and checkout faster.</p>
<form id="f"><div class="fg"><label class="lb" for="email">Email</label><input class="in" id="email" name="email" type="email" required autocomplete="email"></div>
<div class="fg"><label class="lb" for="password">Password</label><input class="in" id="password" name="password" type="password" required autocomplete="current-password"></div>
<div class="err" id="e"></div><button class="btn block" id="sub">Log in</button></form>
<p style="text-align:center;margin:1.2rem 0 0">New here? <a href="#" id="su" style="font-weight:800">Create an account</a></p>
<p style="text-align:center;font-size:.82rem;color:var(--muted)">Forgot your password? <a href="/contact">Message us</a> and we’ll reset it.</p></div></div>
</main>
<div id="chrome-foot"></div>
<script src="/js/app.js?v=21"></script><script src="/js/fx.js?v=21" defer></script>
<script>
const MODE="login";
CT.ready(()=>{
  const $=CT.$; const next=new URL(location.href).searchParams.get('next')||'/account';
  if(CT.user){location.replace(CT.user.role==='admin'?'/admin':safe(next));return}
  function safe(n){return n.startsWith('/')&&!n.startsWith('//')?n:'/account'}
  $('#f').onsubmit=async e=>{e.preventDefault();const b=$('#sub');b.classList.add('loading');b.disabled=true;$('#e').textContent='';
    try{const body=Object.fromEntries(new FormData(e.target));const r=await CT.api('/api/auth/'+MODE,{body});
      // merge guest wishlist
      for(const id of CT.ls.get('ct_wish',[]))if(!(r.user.wishlist||[]).includes(id))await CT.api('/api/account/wishlist/'+id,{method:'POST',body:{}}).catch(()=>{});
      location.href=r.user.role==='admin'?'/admin':safe(next)}
    catch(er){$('#e').textContent=er.message;b.classList.remove('loading');b.disabled=false}};
});
document.addEventListener("click",e=>{if(e.target.id==="su"){e.preventDefault();location.href="/signup"+location.search}});
</script>
</body></html>
