<meta name="theme-color" content="#2e1f7a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="ChaskaTea">

</head><body class="">
<div id="chrome-top"></div>
<main id="main">

<div class="wrap"><div class="authbox"><span class="eyebrow">Join ChaskaTea</span><h1 style="margin-top:.6rem">Create account</h1><p style="color:var(--muted)">Save addresses, track orders and keep a wishlist.</p>
<form id="f"><div class="fg"><label class="lb" for="name">Full name</label><input class="in" id="name" name="name" required autocomplete="name"></div>
<div class="fg"><label class="lb" for="email">Email</label><input class="in" id="email" name="email" type="email" required autocomplete="email"></div>
<div class="fg"><label class="lb" for="phone">Mobile number</label><input class="in" id="phone" name="phone" type="tel" inputmode="numeric" maxlength="10" placeholder="10-digit number" autocomplete="tel-national"></div>
<div class="fg"><label class="lb" for="password">Password (min 6 characters)</label><input class="in" id="password" name="password" type="password" minlength="6" required autocomplete="new-password"></div>
<div class="err" id="e"></div><button class="btn block" id="sub">Create account</button></form>
<p style="text-align:center;margin:1.2rem 0 0">Already have one? <a href="/login" style="font-weight:800">Log in</a></p></div></div>
</main>
<div id="chrome-foot"></div>
<script src="/js/app.js?v=21"></script><script src="/js/fx.js?v=21" defer></script>
<script>
const MODE="signup";
CT.ready(()=>{
  const $=CT.$; const next=new URL(location.href).searchParams.get('next')||'/account';
  if(CT.user){location.replace(CT.user.role==='admin'?'/admin':safe(next));return}
  function safe(n){return n.startsWith('/')&&!n.startsWith('//')?n:'/account'}
  $('#f').onsubmit=async e=>{e.preventDefault();const b=$('#sub');b.classList.add('loading');b.disabled=true;$('#e').textContent='';
    try{const body=Object.fromEntries(new FormData(e.target));const r=await CT.api('/api/auth/'+MODE,{body});
      // merge guest wishlist
      for(const id of CT.ls.get('ct_wish',[]))if(!(r.user.wishlist||[]).includes(id))await CT.api('/api/account/wishlist/'+id,{method:'POST',body:{}}).catch(()=>{});
      location.href=r.user.role==='admin'?'/admin':safe(next)}
    catch(er){$('#e').textContent=er.message;b.classList.remove('loading');b.disabled=false}};
});

</script>
</body></html>
