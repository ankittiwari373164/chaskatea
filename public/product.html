CT.ready(async()=>{

  </div></div>

  </div><div class="pdd-main">

   <details class="acc"><summary>Ingredients &amp; storage</summary><div class="in2"><b>Ingredients:</b> 100% natural Assam CTC black tea. No artificial colour, flavour or additives.<br><b>Origin:</b> Assam, India.<br><b>Ideal for:</b> ${CT.esc(inf.use)}.<br><b>Storage:</b> Keep in an airtight container in a cool, dry place away from strong smells.</div></details>
   <details class="acc"><summary>Delivery, COD &amp; returns</summary><div class="in2">Free delivery across India, usually in 3–7 days. Cash on delivery available. Secure online payment by Razorpay (UPI, cards, netbanking) with upto ₹30 off. Damaged or wrong item? Message us within 48 hours and we’ll make it right.</div></details>
  </div></section>
  <section class="pdp-extra">
   <div class="benefits">${[['leaf','100% natural','No artificial colour, flavour or additives.'],['cup','Rich aroma','Carefully selected Assam leaf for a fragrant cup.'],['bolt','Strong taste','Bold CTC that stands up to milk and spices.'],['box','Packed fresh','Sealed fresh every week to lock in flavour.']].map(([k,t,d])=>`<div class="bn"><i class="bn-${k}"></i><b>${t}</b><span>${d}</span></div>`).join('')}</div>
   ${CT.cfg.reviews.length?`<div class="pdp-rev"><h2>What chai lovers say</h2><div class="rev">${CT.cfg.reviews.slice(0,3).map(v=>`<blockquote><div class="stars">★★★★★</div><p>“${CT.esc(v.text)}”</p><cite>${CT.esc(v.name)}</cite></blockquote>`).join('')}</div></div>`:''}
   <div class="pdp-faq faq"><h2>Questions about ${CT.esc(p.name.replace(/^ChaskaTea /,'').replace(/\s*\|.*$/,''))}</h2>
    <details open><summary>How many cups does the ${CT.esc(p.weight)} pack make?</summary><p>About ${cups} cups, using one heaped teaspoon (around 2.5 g) per cup.</p></details>
    <details><summary>Is cash on delivery available?</summary><p>Yes. Choose Cash on Delivery at checkout. Paying online instead saves you ₹${p.prepaidDiscount||10} more on this pack.</p></details>
    <details><summary>How long does delivery take?</summary><p>Orders are dispatched within 1–2 days and usually arrive in 3–7 working days, with a tracking link by SMS and email.</p></details>
    <details><summary>Does it contain any added flavour or colour?</summary><p>No. It is 100% natural Assam CTC tea. The colour and aroma come only from the tea leaf.</p></details>
   </div>
  </section>`;
  const upd=()=>{$('#q').textContent=qty};
  $('#m')&&($('#m').onclick=()=>{qty=Math.max(1,qty-1);upd()}); $('#pl')&&($('#pl').onclick=()=>{qty=Math.min(20,qty+1);upd()});
  const add=(el)=>{CT.addToCart(p.id,qty,el);CT.toast('Added to cart',{href:'/cart',label:'View cart'})};
  $('#add')&&($('#add').onclick=e=>add(e.target));
  $('#buy')&&($('#buy').onclick=e=>{e.preventDefault();CT.ls.set('ct_buy',[{id:p.id,qty}]);location.href='/checkout?buy=1'});
  document.addEventListener('click',e=>{const t=e.target.closest('.thumbs button');if(!t)return;img=+t.dataset.k;const mi=$('#mi');mi.style.opacity=0;setTimeout(()=>{mi.src=p.images[img];mi.className=isCut(p.images[img])?'cut':'';mi.style.opacity=1},150);CT.$$('.thumbs button').forEach(b=>b.classList.toggle('on',b===t))});
