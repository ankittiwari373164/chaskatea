<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ChaskaTea</title><meta name="description" content="ChaskaTea — premium natural Assam tea. Free delivery, cash on delivery, prepaid savings.">
<meta name="theme-color" content="#2e1f7a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="ChaskaTea">
<link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/img/icon-192.png"><link rel="apple-touch-icon" href="/img/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,400..700,0..100;1,9..144,400..700,0..100&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css?v=3"><link rel="stylesheet" href="/css/bold.css?v=5"><link rel="stylesheet" href="/css/theme.css?v=11">
</head><body class="">
<div id="chrome-top"></div>
<main id="main">

<div class="wrap"><div class="page-head" style="padding-bottom:0"><div class="crumbs"><a href="/">Home</a> / <a href="/shop">Shop</a> / <a id="cl" href="/shop">…</a></div></div>
<div id="pdp"><div class="skeleton" style="min-height:420px"></div></div>
<section id="rel" style="display:none;padding:2rem 0 3rem"><h2 style="margin-bottom:2rem;font-size:2.4rem">You may also like</h2><div class="grid hscroll" id="relg"></div></section></div>
<div class="stickybuy" id="sticky" style="display:none"><button class="btn ghost" id="sadd" >Add to cart</button><a class="btn dark" id="sbuy" href="#">Buy now</a></div>

</main>
<div id="chrome-foot"></div>
<script src="/js/app.js?v=6"></script><script src="/js/fx.js?v=5" defer></script>
<script>

CT.ready(async()=>{
  const $=CT.$, s=new URL(location.href).searchParams.get('s');
  let r; try{r=await CT.api('/api/products/'+encodeURIComponent(s||'x'))}catch(e){location.replace('/404');return}
  const p=r.product; document.title=p.name+' — ChaskaTea'; $('#cl').textContent=p.category; $('#cl').href='/shop?cat='+p.category;
  const off=p.mrp>p.price?Math.round((1-p.price/p.mrp)*100):0; let qty=1, img=0;
  const pre=CT.cfg.settings.payments.prepaidDiscount&&p.prepaidDiscount;
  const sib=r.siblings.length?`<div class="opts"><a class="on">${CT.esc(p.weight)}</a>${r.siblings.map(x=>`<a href="/product?s=${CT.esc(x.slug)}">${CT.esc(x.weight)} · ${CT.inr(x.price)}</a>`).join('')}</div>`:'';
  const isCut=(src)=>/(tea-1xp|chta1|s9\.|8n-l41|ch-01|supreme-dust-1kg|e624|509a|images)/.test(src)&&!/branding/.test(src);
  $('#pdp').innerHTML=`<div class="pdp"><div class="gal"><div class="main t-${CT.esc(p.category)}" data-pic><img id="mi" class="${isCut(p.images[0])?'cut':''}" src="${CT.esc(p.images[0])}" alt="${CT.esc(p.name)}"></div>
   ${p.images.length>1?`<div class="thumbs">${p.images.map((i,k)=>`<button class="${k?'':'on'}" data-k="${k}" aria-label="Photo ${k+1}"><img class="${isCut(i)?'cut':''}" src="${CT.esc(i)}" alt=""></button>`).join('')}</div>`:''}</div>
  <div class="info"><span class="eyebrow">${CT.esc(p.category)} tea · ${CT.esc(p.weight)}</span><h1 style="margin:.6rem 0">${CT.esc(p.name)}</h1>
   <div class="price"><b>${CT.inr(p.price)}</b>${p.mrp>p.price?`<s>${CT.inr(p.mrp)}</s><span class="save">${off}% OFF</span>`:''}</div>
   <p style="font-size:.78rem;color:var(--muted);margin:.4rem 0 0;letter-spacing:.02em">Inclusive of all taxes · Free delivery</p>
   ${pre?`<p style="color:var(--leaf2);font-weight:500;margin:.8rem 0 0;font-size:.9rem">Pay online and save another ₹${p.prepaidDiscount}</p>`:''}
   <p class="lead">${CT.esc(p.short)}</p>${sib}
   <div class="buyrow desk-only"><div class="qty"><button id="m" aria-label="Less">−</button><span id="q">1</span><button id="pl" aria-label="More">+</button></div>
    ${p.stock>0?`<button class="btn" id="add" style="flex:1;min-width:150px">Add to cart</button><a class="btn dark" id="buy" href="/checkout?buy=${p.id}">Buy now</a>`:'<button class="btn" disabled>Sold out</button>'}
    <button class="ibtn wl ${CT.wish.has(p.id)?'on':''}" data-id="${p.id}" aria-label="Wishlist" style="width:48px;height:48px"><svg viewBox="0 0 24 24" style="stroke:var(--ink);fill:${CT.wish.has(p.id)?'var(--gold-d)':'none'}"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 018-2.7A4.5 4.5 0 0120 10c0 5.800-8 11-8 11z"/></svg></button></div>
   ${p.stock>0&&p.stock<=10?`<p style="color:var(--terracotta);font-weight:800">Only ${p.stock} remaining</p>`:''}
   <ul class="hl-list">${p.highlights.map(h=>`<li>${CT.esc(h)}</li>`).join('')}</ul>
   <div class="perks"><div>Free delivery</div><div>₹ Cash on delivery</div><div>100% natural</div><div>Packed in 7 days</div></div>
   <details class="acc" open><summary>About this tea</summary><div class="in2">${CT.esc(p.description)}</div></details>
   <details class="acc"><summary>Brewing guide</summary><div class="in2">Boil 1 cup water, add 1 tsp tea, simmer 2 minutes. Add ½ cup milk and boil once more. Ginger or elaichi go in with the water. Adjust to taste.</div></details>
   <details class="acc"><summary>Delivery &amp; returns</summary><div class="in2">Free delivery across India, usually in 3–7 days. Cash on delivery available. Damaged or wrong item? Message us within 48 hours and we’ll make it right.</div></details>
  </div></div>`;
  const upd=()=>{$('#q').textContent=qty};
  $('#m')&&($('#m').onclick=()=>{qty=Math.max(1,qty-1);upd()}); $('#pl')&&($('#pl').onclick=()=>{qty=Math.min(20,qty+1);upd()});
  const add=(el)=>{CT.addToCart(p.id,qty,el);CT.toast('Added to cart',{href:'/cart',label:'View cart'})};
  $('#add')&&($('#add').onclick=e=>add(e.target));
  $('#buy')&&($('#buy').onclick=e=>{e.preventDefault();CT.ls.set('ct_buy',[{id:p.id,qty}]);location.href='/checkout?buy=1'});
  document.addEventListener('click',e=>{const t=e.target.closest('.thumbs button');if(!t)return;img=+t.dataset.k;const mi=$('#mi');mi.style.opacity=0;setTimeout(()=>{mi.src=p.images[img];mi.className=isCut(p.images[img])?'cut':'';mi.style.opacity=1},150);CT.$$('.thumbs button').forEach(b=>b.classList.toggle('on',b===t))});
  if(p.stock>0&&matchMedia('(max-width:820px)').matches){const st=$('#sticky');st.style.display='flex';document.body.classList.add('has-sticky');
    $('#sadd').onclick=e=>{qty=1;add(e.target)};$('#sbuy').onclick=e=>{e.preventDefault();CT.ls.set('ct_buy',[{id:p.id,qty:1}]);location.href='/checkout?buy=1'}}
  if(r.related.length){$('#rel').style.display='block';$('#relg').innerHTML=r.related.map(CT.card).join('')}
});

</script>
</body></html>
