<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Track Your Order | ChaskaTea</title>
<meta name="description" content="Track your ChaskaTea order with your order number and phone number.">
<meta name="robots" content="index,follow,max-image-preview:large">
<link rel="canonical" href="https://www.chaskatea.com/track">
<meta property="og:site_name" content="ChaskaTea"><meta property="og:locale" content="en_IN"><meta property="og:type" content="website">
<meta property="og:title" content="Track Your Order | ChaskaTea"><meta property="og:description" content="Track your ChaskaTea order with your order number and phone number."><meta property="og:url" content="https://www.chaskatea.com/track"><meta property="og:image" content="https://www.chaskatea.com/img/og-chaskatea.jpg">
<meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="Track Your Order | ChaskaTea"><meta name="twitter:description" content="Track your ChaskaTea order with your order number and phone number."><meta name="twitter:image" content="https://www.chaskatea.com/img/og-chaskatea.jpg">
<meta name="theme-color" content="#2e1f7a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="ChaskaTea">
<link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/img/icon-192.png"><link rel="apple-touch-icon" href="/img/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500..700;1,9..144,400..600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css?v=3"><link rel="stylesheet" href="/css/bold.css?v=5"><link rel="stylesheet" href="/css/theme.css?v=20">
<script src="/js/track.js?v=20"></script>
</head><body class="">
<div id="chrome-top"></div>
<main id="main">

<div class="wrap"><div class="page-head"><h1 style="font-size:clamp(2rem,5vw,3.4rem)">Track your order</h1><p style="color:var(--muted);margin-top:.6rem">Enter your order number and the mobile number you ordered with.</p></div>
<div class="panel" style="max-width:520px"><div class="fg"><label class="lb" for="n">Order number</label><input class="in" id="n" placeholder="CT1001" autocapitalize="characters"></div><div class="fg"><label class="lb" for="p">Mobile number</label><input class="in" id="p" type="tel" inputmode="numeric" maxlength="10"></div><div class="err" id="e"></div><button class="btn block" id="go">Track</button></div>
<div id="res" style="max-width:720px;margin:1.5rem 0 4rem"></div></div>
</main>
<div id="chrome-foot"></div>
<script src="/js/app.js?v=21"></script><script src="/js/fx.js?v=21" defer></script>
<script>

CT.ready(()=>{
  const $=CT.$; const u=new URL(location.href); let last={};try{last=JSON.parse(sessionStorage.getItem('ct_last')||'{}')}catch(e){}
  $('#n').value=u.searchParams.get('n')||last.number||''; $('#p').value=last.phone||'';
  const go=async()=>{$('#e').textContent='';try{const r=await CT.api('/api/track',{body:{number:$('#n').value,phone:$('#p').value}});show(r.order)}catch(e){$('#e').textContent=e.message;$('#res').innerHTML=''}};
  const show=o=>{$('#res').innerHTML=`<div class="panel"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:.5rem"><h3 style="margin:0">Order ${CT.esc(o.number)}</h3><span class="pill ${o.status}">${CT.esc(o.statusLabel)}</span></div>
   ${CT.progress(o.status)}${o.tracking?`<p><b>${CT.esc(o.tracking.courier||'Courier')}</b> · AWB ${CT.esc(o.tracking.awb)} · <a href="${CT.esc(o.tracking.url)}" target="_blank" rel="noopener"><b>Live tracking ↗</b></a></p>`:''}
   <ul class="tl">${o.timeline.slice().reverse().map((t,i)=>`<li class="${i===0?'cur':''}"><b>${CT.esc(t.label)}</b>${t.note?'<br>'+CT.esc(t.note):''}<br><small>${CT.fmtDate(t.at)}</small></li>`).join('')}</ul>
   <p style="font-size:.9rem">${o.items.map(i=>CT.esc(i.name.replace('ChaskaTea ',''))+' × '+i.qty).join(' · ')} — <b>${CT.inr(o.total)}</b> (${o.paymentMethod==='cod'?'Cash on delivery':'Paid online'})</p></div>`};
  $('#go').onclick=go; if($('#n').value&&$('#p').value)go();
});

</script>
</body></html>
